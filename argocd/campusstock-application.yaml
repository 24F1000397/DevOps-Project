apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campusstock
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/24F1000397/DevOps-Project.git
    targetRevision: main
    path: helm/campusstock
    helm:
      releaseName: campusstock
  destination:
    server: https://kubernetes.default.svc
    namespace: campusstock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
