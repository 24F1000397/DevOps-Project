apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: campusstock-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - campusstock
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s