global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  # Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # CampusStock Backend FastAPI Application Scrape Target
  - job_name: "campusstock-api"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "backend:8000"
          - "host.docker.internal:8000"
        labels:
          app: "campusstock"
          environment: "production"
          tier: "backend"
