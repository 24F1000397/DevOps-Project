apiVersion: v1
kind: Service
metadata:
  name: {{ include "campusstock.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "campusstock.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "campusstock.name" . }}-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
