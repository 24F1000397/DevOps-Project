{{- if .Values.postgres.credentials.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campusstock.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "campusstock.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.credentials.database | quote }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.credentials.user }}:{{ .Values.postgres.credentials.password }}@{{ include "campusstock.fullname" . }}-postgres:5432/{{ .Values.postgres.credentials.database }}"
{{- end }}
