apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "campusstock.fullname" . }}-frontend-nginx
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://campusstock-backend:8000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://campusstock-backend:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /ready {
            proxy_pass http://campusstock-backend:8000/ready;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }